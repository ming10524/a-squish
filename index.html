<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A SQUISH</title><style>*{box-sizing:border-box}body{margin:0;background:#f6eee4;color:#59483e;font:16px system-ui;text-align:center}main{max-width:680px;margin:auto;padding:12px}h1{margin:8px}p{margin:8px}#stage{background:radial-gradient(ellipse,#fffdf7,#e9ddcb);border-radius:30px;touch-action:none;user-select:none;overflow:hidden;height:min(52vh,390px);min-height:220px}svg{width:100%;height:100%}button{border:0;border-radius:16px;padding:12px;background:#fff9ef;color:inherit;font:inherit;cursor:pointer}button.active{background:#795e4b;color:white}#roles,#modes{display:grid;gap:8px;margin:12px 0}#roles{grid-template-columns:repeat(4,1fr)}#roles span{display:block;font-size:27px}#modes{grid-template-columns:repeat(3,1fr);padding-bottom:12px;border-bottom:1px solid #dfcdb9}small{color:#806f61}</style><main><small>DARK ZOO 暗黑動物區</small><h1>A SQUISH</h1><p>今天捏誰？</p><div id="stage"><svg viewBox="0 0 400 320"><ellipse cx="200" cy="280" rx="100" ry="15" fill="#79634a" opacity=".13"/><g id="pet"></g><text id="effect" x="200" y="30" text-anchor="middle" font-size="25" fill="#c77b85"></text></svg></div><p id="msg"></p><div id="modes"></div><div id="roles"></div><button id="sound">🔊 音效開啟</button><p><small>V0.1 · 無分數、無時間限制</small></p></main><script>
const chars=[['鴨董','🐥','#ffcf53','嘎嘎！'],['海龜','🐢','#91bd78','嗚～'],['章魚','🐙','#df93b6','噗啾！'],['綿羊','🐑','#f4e9db','咩～'],['兔子','🐰','#e7d6ec','啾！'],['粉紅貓','🐱','#f3a9bf','喵～'],['金魚','🐠','#ffad65','啵啵！'],['青菜人','🥬','#9acb79','沙沙～']];
const $=s=>document.querySelector(s),pet=$('#pet'),stage=$('#stage'),msg=$('#msg'),effect=$('#effect'),pts=new Map();let idx=0,mode=0,sound=true,ctx,last=-1000,until=0,sx=1,sy=1,dx=0,dy=0,tx=1,ty=1,ox=0,oy=0,vx=0,vy=0,wx=0,wy=0;
function draw(){const c=chars[idx],extra=['<ellipse cx="100" cy="175" rx="35" ry="48" fill="#efb942"/><ellipse cx="300" cy="175" rx="35" ry="48" fill="#efb942"/>','<ellipse cx="200" cy="175" rx="123" ry="95" fill="#638d53"/>',[95,130,165,235,270,305].map(x=>'<ellipse cx="'+x+'" cy="238" rx="22" ry="44" fill="#d783a8"/>').join(''),'<circle cx="120" cy="110" r="43" fill="#fff6eb"/><circle cx="280" cy="110" r="43" fill="#fff6eb"/>','<ellipse cx="157" cy="66" rx="26" ry="60" fill="#e7d6ec"/><ellipse cx="243" cy="66" rx="26" ry="60" fill="#e7d6ec"/>','<path d="M105 133 L110 42 L181 91 M219 91 L290 42 L295 133" fill="#f3a9bf"/>','<path d="M275 155 L365 90 L350 230 Z" fill="#f58e50"/>','<path d="M200 110 Q100 5 155 12 Q200 0 200 85 Q255 -5 275 22 Q280 75 200 110" fill="#67a858"/>'][idx];pet.innerHTML=extra+'<ellipse cx="200" cy="166" rx="105" ry="105" fill="'+c[2]+'"/><ellipse cx="170" cy="100" rx="39" ry="18" fill="white" opacity=".25"/><g id="eyes"><ellipse cx="163" cy="151" rx="9" ry="13" fill="#453c39"/><ellipse cx="237" cy="151" rx="9" ry="13" fill="#453c39"/></g><ellipse cx="140" cy="177" rx="16" ry="9" fill="#ee8790" opacity=".6"/><ellipse cx="260" cy="177" rx="16" ry="9" fill="#ee8790" opacity=".6"/>'+(idx===0?'<ellipse cx="200" cy="180" rx="31" ry="16" fill="#ef963f"/>':'<path d="M187 178 Q200 194 213 178" fill="none" stroke="#59433f" stroke-width="4" stroke-linecap="round"/>');msg.textContent=c[0]+'：今天也辛苦了！';effect.textContent='';document.querySelectorAll('#roles button').forEach((b,i)=>b.classList.toggle('active',i===idx))}
chars.forEach((c,i)=>{const b=document.createElement('button');b.innerHTML='<span>'+c[1]+'</span>'+c[0];b.onclick=()=>{idx=i;draw()};$('#roles').append(b)});
['🤏 捏捏','👐 擠壓','✋ 撫摸','↔️ 拉扯','🪶 搔癢','👆 戳戳'].forEach((m,i)=>{const b=document.createElement('button');b.textContent=m;b.classList.toggle('active',i===0);b.onclick=()=>{mode=i;document.querySelectorAll('#modes button').forEach((x,j)=>x.classList.toggle('active',i===j))};$('#modes').append(b)});
function beep(){if(!sound)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type=['sine','triangle','sine','triangle','sine','sine','sine','triangle'][idx];o.frequency.setValueAtTime(280+idx*42,t);o.frequency.exponentialRampToValueAtTime(150+idx*25,t+.22);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.07,t+.035);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(ctx.destination);o.start();o.stop(t+.26)}catch(e){}}
$('#sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 音效開啟':'🔇 音效關閉'};
function react(){const now=performance.now();until=now+650;effect.textContent=mode===2?'♥ ♡ ♥':mode===4?'✦ 哈哈哈 ✦':chars[idx][3];msg.textContent=mode===2?'好舒服～':mode===4?'好癢呀！':chars[idx][3];if(now-last>260){beep();last=now}}
stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY,a:e.clientX,b:e.clientY});react();[tx,ty]=[[.75,1.12],[1.28,.65],[1.04,.98],[1.12,1.05],[1.05,.95],[1.12,.84]][mode]};
stage.onpointermove=e=>{const p=pts.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;const x=(p.x-p.a)*.55,y=(p.y-p.b)*.55;if(pts.size>1){const [a,b]=[...pts.values()],r=Math.hypot(a.x-b.x,a.y-b.y)/Math.max(20,Math.hypot(a.a-b.a,a.b-b.b));tx=Math.max(.55,Math.min(1.45,r));ty=1+(1-tx)*.5}else if(mode===3){ox=Math.max(-65,Math.min(65,x));oy=Math.max(-55,Math.min(55,y));tx=1+Math.min(.4,Math.abs(x)/180);ty=1+Math.min(.35,Math.abs(y)/180)}else if(mode===2||mode===4){ox=Math.sin(performance.now()/45)*(mode===4?9:3)}else if(mode===0){tx=Math.max(.55,.85-Math.abs(x)/300);ty=1.15}react()};
function release(e){pts.delete(e.pointerId);if(!pts.size){tx=ty=1;ox=oy=0}}stage.onpointerup=stage.onpointercancel=stage.onlostpointercapture=release;
function loop(t){vx=(vx+(tx-sx)*.12)*.76;vy=(vy+(ty-sy)*.12)*.76;wx=(wx+(ox-dx)*.12)*.76;wy=(wy+(oy-dy)*.12)*.76;sx+=vx;sy+=vy;dx+=wx;dy+=wy;pet.setAttribute('transform','translate('+(200+dx)+' '+(170+dy+Math.sin(t/700)*2)+') scale('+sx+' '+sy+') translate(-200 -170)');$('#eyes').setAttribute('transform',t<until&&(mode===2||mode===4)?'translate(0 120.8) scale(1 .2)':'');if(t>until)effect.textContent='';requestAnimationFrame(loop)}draw();requestAnimationFrame(loop);
</script></html>
